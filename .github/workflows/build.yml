name: Build and Test
on:
  push:
    branches:
      - gitact-test
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java-version: [ 24, 25-ea ]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java-version }}
          distribution: temurin
      - name: Cache Maven artifacts
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-
      - name: Cache node
        uses: actions/cache@v4
        with:
          path: web-bundle/node
          key: ${{ runner.os }}-node-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os}}-node-
      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: web-bundle/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/pom.xml', '**/package.json') }}
          restore-keys: |
            ${{ runner.os}}-node_modules-
      - name: Build ${{ matrix.java-version }}
        run: mvn -B clean test

      - name: build external modules
        run: mvn -q -DskipTests install

      - name: Fetch full history
        run: git fetch --unshallow || git fetch --all --tags

      - name: initial pitest report
        id: old
        run: |
          git checkout ${{ github.event.before }}
          mvn -q -DskipTests install
          
          CHANGED_FILES=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }} | grep '\.java$' || true)
          
          if [[ -z "$CHANGED_FILES" ]]; then
            echo "No Java files identified"
            echo "score=100" >> $GITHUB_OUTPUT
            exit 0
          fi
          echo "trace A"
          
          # hashmap qui contiendra les modules qui doivent être explorés
          declare -A MODULES_AFFECTED
          
          while IFS= read -r FILE; do
            # On obtient le nom du module de chaque fichier
            MODULE_DIR="${FILE%%/*}"
          
            # on construit les deux chemins pour identifier si c'est un test ou un main
            PREFIX_MAIN="${MODULE_DIR}/src/main/java/"
            PREFIX_TEST="${MODULE_DIR}/src/test/java/"
          
            # on prend le chemin sans le prefix (e.i ..du répertoire)
            if [[ "$FILE" == $PREFIX_MAIN* ]]; then
              PATH_WITHOUT_PREFIX="${FILE#$PREFIX_MAIN}"
            elif [[ "$FILE" == $PREFIX_TEST* ]]; then
              if [[ "$FILE" != *Test.java ]]; then
                PATH_WITHOUT_PREFIX="*"
              else
                PATH_WITHOUT_PREFIX="${FILE#$PREFIX_TEST}"
                PATH_WITHOUT_PREFIX="${PATH_WITHOUT_PREFIX%Test.java}"
              fi
            else
              continue
            fi
          
            # chemin (sert à l'argument de classe pr la commande pitest)
            PATH_FOR_PIT="${PATH_WITHOUT_PREFIX%.java}"
            PATH_FOR_PIT="${PATH_FOR_PIT//\//.}"
          
            # On maintient les classes précédentes, mais on ajoute une classe (du même module)
          
            # NE PAS SUPPRIMER, L'INITIALISATION "" CAUSE PROBLÈME, GARDER COMME ÇA
            if [ -z "${MODULES_AFFECTED[$MODULE_DIR]}" ]; then
              MODULES_AFFECTED[$MODULE_DIR]="$PATH_FOR_PIT"
            elif [[ "${MODULES_AFFECTED[$MODULE_DIR]}" == "*" ]]; then
              continue
            else
              MODULES_AFFECTED[$MODULE_DIR]="${MODULES_AFFECTED[$MODULE_DIR]},$PATH_FOR_PIT"
            fi
          
          done <<< "$CHANGED_FILES"

          # les chemins pour la commande mvn pitest sont créés
          
          # il manque des patterns, mais on va essayer si ça marche d'abord comme ça.
          for MODULE_DIR in "${!MODULES_AFFECTED[@]}"; do
            TARGET_CLASSES="${MODULES_AFFECTED[$MODULE_DIR]}"
            TEST_PATTERN="com.graphhopper.*Test"
          
            # POUR CE MODULE PRÉCIS!!!
            echo "test pattern est : $TEST_PATTERN"
            echo "class pattern est : $TARGET_CLASSES"
          
            (
              cd "$MODULE_DIR"
              echo "$TARGET_CLASSES"
              mvn org.pitest:pitest-maven:1.21.1:mutationCoverage -DtargetClasses="$TARGET_CLASSES" -DtargetTests="$TEST_PATTERN" -DoutputFormats=HTML
              SCORE=$(grep -oP '(?<=<td>)[0-9]{1,3}(?=%)' target/pit-reports/index.html | sed -n '2p')
              echo "Le score est $SCORE"
              echo "$MODULE_DIR=$SCORE" >> $GITHUB_OUTPUT
              case "$MODULE_DIR" in
                core)
                  echo "core=$SCORE" >> $GITHUB_OUTPUT
                  ;;
                navigation)
                  echo "navigation=$SCORE" >> $GITHUB_OUTPUT
                  ;;
                example)
                  echo "example=$SCORE" >> $GITHUB_OUTPUT
                  ;;
                map-matching)
                  echo "map-matching=$SCORE" >> $GITHUB_OUTPUT
                  ;;
                reader-gtfs)
                  echo "reader-gtfs=$SCORE" >> $GITHUB_OUTPUT
                  ;;
                tools)
                  echo "tools=$SCORE" >> $GITHUB_OUTPUT
                  ;;
                web)
                  echo "web=$SCORE" >> $GITHUB_OUTPUT
                  ;;
                web-api)
                  echo "web-api=$SCORE" >> $GITHUB_OUTPUT
                  ;;
                web-bundle)
                  echo "web-bundle=$SCORE" >> $GITHUB_OUTPUT
                  ;;
                *)
                  echo "idk=$SCORE" >> $GITHUB_OUTPUT
                  ;;
              esac
            )
          done

      - name: pitest report for modified
        id: new
        run: |
          git checkout ${{ github.sha }}
          mvn -q -DskipTests install
          
          CHANGED_FILES=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }} | grep '\.java$' || true)
          
          if [[ -z "$CHANGED_FILES" ]]; then
            echo "No Java files identified"
            echo "score=100" >> $GITHUB_OUTPUT
            exit 0
          fi
          echo "trace A"
          
          # hashmap qui contiendra les modules qui doivent être explorés
          declare -A MODULES_AFFECTED
          
          while IFS= read -r FILE; do
            # On obtient le nom du module de chaque fichier
            MODULE_DIR="${FILE%%/*}"
          
            # on construit les deux chemins pour identifier si c'est un test ou un main
            PREFIX_MAIN="${MODULE_DIR}/src/main/java/"
            PREFIX_TEST="${MODULE_DIR}/src/test/java/"
          
            # on prend le chemin sans le prefix (e.i ..du répertoire)
            if [[ "$FILE" == $PREFIX_MAIN* ]]; then
              PATH_WITHOUT_PREFIX="${FILE#$PREFIX_MAIN}"
            elif [[ "$FILE" == $PREFIX_TEST* ]]; then
              if [[ "$FILE" != *Test.java ]]; then
                PATH_WITHOUT_PREFIX="*"
              else
                PATH_WITHOUT_PREFIX="${FILE#$PREFIX_TEST}"
                PATH_WITHOUT_PREFIX="${PATH_WITHOUT_PREFIX%Test.java}"
              fi
            else
              continue
            fi
          
            # chemin (sert à l'argument de classe pr la commande pitest)
            PATH_FOR_PIT="${PATH_WITHOUT_PREFIX%.java}"
            PATH_FOR_PIT="${PATH_FOR_PIT//\//.}"
          
            # On maintient les classes précédentes, mais on ajoute une classe (du même module)
          
            # NE PAS SUPPRIMER, L'INITIALISATION "" CAUSE PROBLÈME, GARDER COMME ÇA
            if [ -z "${MODULES_AFFECTED[$MODULE_DIR]}" ]; then
              MODULES_AFFECTED[$MODULE_DIR]="$PATH_FOR_PIT"
            elif [[ "${MODULES_AFFECTED[$MODULE_DIR]}" == "*" ]]; then
              continue
            else
              MODULES_AFFECTED[$MODULE_DIR]="${MODULES_AFFECTED[$MODULE_DIR]},$PATH_FOR_PIT"
            fi
          
          done <<< "$CHANGED_FILES"

          # les chemins pour la commande mvn pitest sont créés
          
          # il manque des patterns, mais on va essayer si ça marche d'abord comme ça.
          for MODULE_DIR in "${!MODULES_AFFECTED[@]}"; do
            TARGET_CLASSES="${MODULES_AFFECTED[$MODULE_DIR]}"
            TEST_PATTERN="com.graphhopper.*Test"
          
            # POUR CE MODULE PRÉCIS!!!
            echo "test pattern est : $TEST_PATTERN"
            echo "class pattern est : $TARGET_CLASSES"
          
            (
              cd "$MODULE_DIR"
              echo "$TARGET_CLASSES"
              mvn org.pitest:pitest-maven:1.21.1:mutationCoverage -DtargetClasses="$TARGET_CLASSES" -DtargetTests="$TEST_PATTERN" -DoutputFormats=HTML
              SCORE=$(grep -oP '(?<=<td>)[0-9]{1,3}(?=%)' target/pit-reports/index.html | sed -n '2p')
              echo "Le score est $SCORE"
              echo "$MODULE_DIR=$SCORE" >> $GITHUB_OUTPUT
              case "$MODULE_DIR" in
                core)
                  echo "core=$SCORE" >> $GITHUB_OUTPUT
                  ;;
                navigation)
                  echo "navigation=$SCORE" >> $GITHUB_OUTPUT
                  ;;
                example)
                  echo "example=$SCORE" >> $GITHUB_OUTPUT
                  ;;
                map-matching)
                  echo "map-matching=$SCORE" >> $GITHUB_OUTPUT
                  ;;
                reader-gtfs)
                  echo "reader-gtfs=$SCORE" >> $GITHUB_OUTPUT
                  ;;
                tools)
                  echo "tools=$SCORE" >> $GITHUB_OUTPUT
                  ;;
                web)
                  echo "web=$SCORE" >> $GITHUB_OUTPUT
                  ;;
                web-api)
                  echo "web-api=$SCORE" >> $GITHUB_OUTPUT
                  ;;
                web-bundle)
                  echo "web-bundle=$SCORE" >> $GITHUB_OUTPUT
                  ;;
                *)
                  echo "idk=$SCORE" >> $GITHUB_OUTPUT
                  ;;
              esac
            )
          done

      - name: comparison
        run: |
          if [ "${{ steps.new.outputs.core }}" -lt "${{ steps.old.outputs.core }}" ]; then
            echo "Erreur : Le score de mutation a baissé dans le module core" >&2
            exit 1
          elif [ "${{ steps.new.outputs.navigation }}" -lt "${{ steps.old.outputs.navigation }}" ]; then
            echo "Erreur : Le score de mutation a baissé dans le module navigation" >&2
            exit 1
          elif [ "${{ steps.new.outputs.example }}" -lt "${{ steps.old.outputs.example }}" ]; then
            echo "Erreur : Le score de mutation a baissé dans le module example" >&2
            exit 1
          elif [ "${{ steps.new.outputs.map-matching }}" -lt "${{ steps.old.outputs.map-matching }}" ]; then
            echo "Erreur : Le score de mutation a baissé dans le module map-matching" >&2
            exit 1
          elif [ "${{ steps.new.outputs.reader-gtfs }}" -lt "${{ steps.old.outputs.reader-gtfs }}" ]; then
            echo "Erreur : Le score de mutation a baissé dans le module reader-gtfs" >&2
            exit 1
          elif [ "${{ steps.new.outputs.tools }}" -lt "${{ steps.old.outputs.tools }}" ]; then
            echo "Erreur : Le score de mutation a baissé dans le module tools" >&2
            exit 1
          elif [ "${{ steps.new.outputs.web }}" -lt "${{ steps.old.outputs.web }}" ]; then
            echo "Erreur : Le score de mutation a baissé dans le module web" >&2
            exit 1
          elif [ "${{ steps.new.outputs.web-api }}" -lt "${{ steps.old.outputs.web-api }}" ]; then
            echo "Erreur : Le score de mutation a baissé dans le module web-api" >&2
            exit 1
          elif [ "${{ steps.new.outputs.web-bundle }}" -lt "${{ steps.old.outputs.web-bundle }}" ]; then
            echo "Erreur : Le score de mutation a baissé dans le module web-bundle" >&2
            exit 1
          elif [ "${{ steps.new.outputs.idk }}" -lt "${{ steps.old.outputs.idk }}" ]; then
            echo "Erreur : Le score de mutation a baissé dans le module quelconque" >&2
            exit 1
          fi
